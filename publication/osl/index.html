  <script>
    function toggleCitation(button) {
      const wrapper = button.closest('.publication');
      const container = wrapper.querySelector('.citation-container');
      const arrow = button.querySelector('.arrow');

      const isOpen = container.classList.toggle('show');
      arrow.classList.toggle('rotate', isOpen);
    }

    function copyCitation(copyButton) {
	const wrapper = copyButton.closest('.bibtex-box');
	const bibtexBox = wrapper.querySelector('.bibtex-text');
	const text = bibtexBox.innerText;

	navigator.clipboard.writeText(text).then(() => {
            showToast('Citation copied to clipboard!');
	}).catch(() => {
            showToast('Failed to copy citation.');
	});
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
